name: Deploy Production

on:
  workflow_dispatch:
  push:
    branches:
      - release

concurrency:
  group: tg-v-chat-deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  GHCR_NAMESPACE: ${{ github.repository_owner }}
  IMAGE_NAME: tg-v-chat
  TEST_DATABASE_URL: postgresql+psycopg://tester:tester@127.0.0.1:5432/tg_v_chat_test?connect_timeout=3

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tester
          POSTGRES_PASSWORD: tester
          POSTGRES_DB: tg_v_chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tester -d tg_v_chat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        env:
          TG_V_CHAT_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          TG_V_CHAT_SESSION_KEY: ci-session-key-for-tests
          TG_V_CHAT_BOT_TOKEN: ci-bot-token
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Compile
        run: python -m compileall -q src tests

      - name: PostgreSQL migration check
        env:
          TG_V_CHAT_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: alembic upgrade head

      - name: Tests
        env:
          TG_V_CHAT_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          TG_V_CHAT_SESSION_KEY: ci-session-key-for-tests
          TG_V_CHAT_BOT_TOKEN: ci-bot-token
        run: python -m pytest

  build-image:
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ env.GHCR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=tg-v-chat
          cache-to: type=gha,mode=max,scope=tg-v-chat

  deploy:
    runs-on: ubuntu-latest
    needs:
      - checks
      - build-image
    environment: production-silicon-valley

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate deploy secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SILICON_VALLEY_PRODUCTION_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.SILICON_VALLEY_PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.SILICON_VALLEY_PRODUCTION_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}"
          test -n "${DEPLOY_HOST}"
          test -n "${DEPLOY_USER}"
          test -n "${GHCR_TOKEN}"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SILICON_VALLEY_PRODUCTION_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.SILICON_VALLEY_PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.SILICON_VALLEY_PRODUCTION_USER }}
          DEPLOY_PORT: ${{ secrets.SILICON_VALLEY_PRODUCTION_PORT }}
          SSH_CONNECT_TIMEOUT: ${{ vars.SSH_CONNECT_TIMEOUT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${DEPLOY_PORT:-22}"
          CONNECT_TIMEOUT="${SSH_CONNECT_TIMEOUT:-60}"
          cat > ~/.ssh/config <<EOF
          Host silicon-valley-production-server
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            Port ${PORT}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ConnectTimeout ${CONNECT_TIMEOUT}
            ServerAliveInterval 15
            ServerAliveCountMax 8
            ControlMaster auto
            ControlPersist 10m
            ControlPath ~/.ssh/control-%C
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy via SSH release script
        env:
          SILICON_VALLEY_PRODUCTION_BASE_DIR: ${{ vars.SILICON_VALLEY_PRODUCTION_BASE_DIR }}
          SILICON_VALLEY_RELEASE_BRANCHES: ${{ vars.SILICON_VALLEY_RELEASE_BRANCHES }}
          DEPLOY_USER: ${{ secrets.SILICON_VALLEY_PRODUCTION_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
          TG_V_CHAT_IMAGE: ghcr.io/${{ env.GHCR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          SSH_CONNECT_TIMEOUT: ${{ vars.SSH_CONNECT_TIMEOUT }}
          RELEASE_SSH_ATTEMPTS: ${{ vars.RELEASE_SSH_ATTEMPTS }}
          RELEASE_SSH_RETRY_DELAY: ${{ vars.RELEASE_SSH_RETRY_DELAY }}
          POST_DEPLOY_CHECKS_ENABLED: ${{ vars.POST_DEPLOY_CHECKS_ENABLED }}
        run: |
          set -euo pipefail
          BASE_DIR="${SILICON_VALLEY_PRODUCTION_BASE_DIR:-/data/tg-v-chat}"
          BRANCHES="${SILICON_VALLEY_RELEASE_BRANCHES:-release}"
          bash deploy/release.sh \
            --host silicon-valley-production-server \
            --user "${DEPLOY_USER}" \
            --base-dir "${BASE_DIR}" \
            --branch-list "${BRANCHES}" \
            --ssh-opt "-F" \
            --ssh-opt "$HOME/.ssh/config"
