[project]
name = "tg-v-chat"
version = "0.1.0"
description = "Telegram private relay V1"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "cryptography>=42",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2",
  "telethon>=1.34,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
